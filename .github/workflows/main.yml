name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile Rules LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory : Rules
          root_file: main.tex
      - name: Compile Solutions LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory : Solutions
          root_file: Solutions.tex                    
      - name: Upload Rules PDF files
        uses: actions/upload-artifact@v4
        with:
          name: RulesPDF
          path: Rules/main.pdf
      - name: Upload Solutions PDF files
        uses: actions/upload-artifact@v4
        with:
          name: SolnsPdf
          path: Solutions/Solutions.pdf
